<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Phenix architecture</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
:root {
  --am-surface: oklch(1 0 0);
  --am-border: oklch(0.92 0.004 286.32);
  --am-structure: oklch(0.705 0.015 286.067);
  --am-ink-primary: oklch(0.141 0.005 285.823);
  --am-ink-secondary: oklch(0.442 0.017 285.786);
  --am-ink-tertiary: oklch(0.552 0.016 285.938);
  --am-accent: oklch(0.488 0.243 264.376);
  --am-accent-wash: oklch(0.93 0.045 264.376);
  --am-font-title: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --am-font-body: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --am-font-mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
}
.dark {
  --am-surface: oklch(0.141 0.005 285.823);
  --am-border: oklch(1 0 0 / 12%);
  --am-structure: oklch(0.552 0.016 285.938);
  --am-ink-primary: oklch(0.985 0 0);
  --am-ink-secondary: oklch(0.871 0.006 286.286);
  --am-ink-tertiary: oklch(0.705 0.015 286.067);
  --am-accent: oklch(0.623 0.214 259.815);
  --am-accent-wash: oklch(0.28 0.07 264.376);
}
html, body { margin: 0; padding: 0; }
body { background: var(--am-surface); color: var(--am-ink-primary); font-family: var(--am-font-body); }
@keyframes am-dash{to{stroke-dashoffset:-18px}}@media (prefers-reduced-motion: reduce){[style*=am-dash]{animation:none!important}}
</style>
<script>try{var t=localStorage.getItem("am-theme");var d=t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;if(d)document.documentElement.classList.add("dark")}catch(e){}</script>

l and departure forms and the live yard overlook \u2014 the whole yard drawn from one snapshot call, areas and spots and trailers with direction gauges.",howItsBuilt:"Every response is parsed with [[zod schemas]] generated (orval) from the yard service\u2019s published OpenAPI specs, so a drifted contract fails loudly in development instead of rendering quietly wrong.",files:["phenix.ui/apps/yard/src/pages/arrival/","phenix.ui/apps/yard/src/pages/overlook/","phenix.ui/apps/yard/src/generated/yard-api.zod.ts","phenix.ui/apps/yard/orval.config.ts"],stack:["React Query","orval","zod"]},{id:"ui-appointments-app",archetype:"cube",code:"AP",name:"Appointments sub-app",role:"the maintenance grid",group:"browser",whatItDoes:"The appointments maintenance grid: search across warehouses with rich filters, then act \u2014 maintenance edits, notes, catalog-driven statuses.",howItsBuilt:"A thin client over the service\u2019s search API: the mapping between filter UI and query params is isolated in one mapper module, and access is gated per warehouse by a [[feature-flag]] wrapper while the rollout is in progress.",files:["phenix.ui/apps/appointments/src/components/AppointmentsMaintenanceTable/AppointmentsMaintenanceTable.tsx","phenix.ui/apps/appointments/src/hooks/useMaintenanceAppointmentsSearch.ts","phenix.ui/apps/appointments/src/lib/maintenanceFilterApiMappers.ts"],stack:["React Query"]},{id:"ui-transaction-app",archetype:"slab-stack",params:{levels:5},code:"TX",name:"Transaction history",role:"the activity browser",group:"browser",whatItDoes:"Browsing and drill-down over warehouse activity \u2014 the first screen ported from v1, plus a migration-state module tracking which warehouses have been cut over.",howItsBuilt:"Structured as self-contained modules with their own axios service layer and i18n bundle. It predates the newer sub-app conventions and reads differently from its siblings \u2014 the oldest building in the browser district.",files:["phenix.ui/apps/transaction-history/src/modules/transaction-history/","phenix.ui/apps/transaction-history/src/modules/migration-state/","phenix.ui/apps/transaction-history/src/core/auth/"],stack:["axios","React Query"]},{id:"ui-bff",archetype:"cube",code:"BF",name:"UI-BFF gateway",role:"the server-side front door",group:"platform",whatItDoes:"Next.js route handlers every browser call funnels through: /ui-bff/&lt;service&gt;/* is forwarded to the right backend on the internal network with the caller\u2019s bearer token, so the browser only ever talks to its own origin.",howItsBuilt:"One generic passthrough covers five services from a single registry; the yard route is special-cased for development conveniences \u2014 canned fixtures, and a [[digit-sweep]] that fans one list call into many upstream pages and merges the results.",files:["phenix.ui/apps/shell/src/app/ui-bff/serviceRegistry.ts","phenix.ui/apps/shell/src/app/ui-bff/[svc]/[...path]/route.ts","phenix.ui/apps/shell/src/app/ui-bff/yard/[...path]/route.ts","phenix.ui/apps/shell/src/app/ui-bff/_proxy/proxy.ts"],stack:["Next.js route handlers"]},{id:"ui-kit",code:"UK",name:"UI kit",role:"the component library",group:"platform",whatItDoes:"The shared component library: shadcn-style primitives plus the app chrome \u2014 sidebar, command palette, page templates, theming \u2014 that every sub-app renders through.",howItsBuilt:"Primitives follow the shadcn pattern but are rebuilt on [[Base UI]] rather than Radix. Every primitive carries a co-located story, which doubles as tamper-detection: running the stock shadcn generator would overwrite the customization and the missing story flags it.",files:["phenix.ui/packages/ui/src/components/ui/","phenix.ui/packages/ui/src/components/Form/","phenix.ui/packages/shell-ui/src/components/AppSidebar/"],stack:["Base UI","Tailwind 4","Storybook"]},{id:"ui-form-engine",archetype:"slab-stack",params:{levels:4},code:"FE",name:"Form engine",role:"the schema-driven form renderer",group:"platform",whatItDoes:"Renders the yard\u2019s data-entry forms from declarative schemas \u2014 field types, visibility rules, validation \u2014 instead of hand-built JSX per form.",howItsBuilt:"A plugin-and-rules architecture: field renderers and cross-field [[rules]] register against the schema walker, so gate arrival and departure share one vocabulary and a new form is mostly configuration.",files:["phenix.ui/packages/form-engine/src/schema/","phenix.ui/packages/form-engine/src/renderer/","phenix.ui/packages/form-engine/src/rules/"]},{id:"ui-session-auth",archetype:"cube",code:"SA",name:"Session & auth",role:"the session gate",group:"platform",whatItDoes:"Decides who is signed in and keeps them that way: the Keycloak OIDC dance, tokens in sessionStorage with a presence cookie the middleware checks, proactive refresh, and the session-scoped stores for feature flags, warehouse context and user preferences.",howItsBuilt:"An expired backend call comes back marked with a session-expired header and [[apiFetch]] re-bootstraps once before failing \u2014 new tabs inherit a session without re-running the redirect. Feature flags are plain preference records, so they need no service of their own.",files:["phenix.ui/packages/auth/src/service/authService.ts","phenix.ui/packages/auth/src/utils/apiFetch.ts","phenix.ui/packages/session/src/bootstrap/","phenix.ui/apps/shell/src/proxy.ts"],stack:["Keycloak","OIDC"]},{id:"ui-workshop",code:"WS",name:"The workshop",role:"the monorepo's toolbench",group:"platform",whatItDoes:"Everything that builds and guards the monorepo rather than shipping in it: the wrapper-sync and check scripts, plop generators, the Playwright smoke suite, and the shared ESLint, TypeScript, Vitest and Storybook presets.",howItsBuilt:"Conventions are enforced rather than documented: sync-sub-app-wrappers regenerates the shell\u2019s thin wrappers, check scripts fail CI when setup drifts, and [[boundary rules]] in ESLint keep sub-apps from importing each other.",files:["phenix.ui/scripts/sync-sub-app-wrappers.ts","phenix.ui/generators/plopfile.ts","phenix.ui/e2e/","phenix.ui/packages/eslint-config/app-boundaries.js"],stack:["Turborepo","pnpm","Playwright","plop"]},{id:"yard-core",archetype:"slab-stack",params:{levels:5},code:"YC",name:"Lifted YMS core",role:"the old engine, transplanted",group:"yard",whatItDoes:"The yard domain as it arrived from the v1 monolith: gate, move and task services, form beans and Hibernate DAOs for arrivals, departures, moves, pre-cool, checks and transfers. Still the code that actually runs the yard.",howItsBuilt:"[[Lifted]] deliberately as-is \u2014 JSP-era controllers and DAOs included \u2014 so behavior stayed identical while everything around it modernizes. New faces are carved off it rather than rewriting it in place, which is why it is the biggest building on the map.",files:["phenix.yard/src/main/java/com/uscs/phenix/yard/be/yms/service/ArrivalServiceImpl.java","phenix.yard/src/main/java/com/uscs/phenix/yard/be/yms/","phenix.yard/src/main/java/com/uscs/phenix/yard/be/location/"],stack:["Spring Boot","Hibernate"]},{id:"yard-v2-api",code:"YV",name:"V2 API & slices",role:"the service's new face",group:"yard",whatItDoes:"The new face of the service: REST controllers for the v2 UI (trailers, tasks, visitors, operations), the overlook snapshot, the read-only yard-setup API, and the package-by-feature domain slices \u2014 trailer, location, occupancy, driver, warehouse.",howItsBuilt:"The _v2 controllers are [[adapters]]: they translate clean REST into calls on the lifted core\u2019s helpers instead of duplicating its logic. The contract is five published OpenAPI specs, the same files the UI generates its zod clients from.",files:["phenix.yard/src/main/java/com/uscs/phenix/yard/be/_v2/yms/YardTrailerController.java","phenix.yard/src/main/java/com/uscs/phenix/yard/overlook/OverlookController.java","phenix.yard/src/main/java/com/uscs/phenix/yard/setup/YardSetupApiController.java","phenix.yard/src/main/resources/openapi/yard-api.yaml"],stack:["Spring MVC","OpenAPI"]},{id:"yard-seams",code:"YS",name:"Stubs & seams",role:"the placeholder boundary",group:"yard",whatItDoes:"The boundary with systems the yard does not own: appointment search assembled from the yard\u2019s own gate and trailer state, and a stub layer standing in for warehouse master data, carriers, load tracker and shipment status.",howItsBuilt:"Every outbound dependency sits behind an interface whose default implementation is a local no-op \u2014 the service runs in isolation. A Feign-backed implementation is selected under the [[DISTRIBUTED]] profile as each real integration arrives.",files:["phenix.yard/src/main/java/com/uscs/phenix/yard/appointments/impl/DefaultAppointmentSearchService.java","phenix.yard/src/main/java/com/uscs/phenix/yard/stubs/appointment/","phenix.yard/src/main/java/com/uscs/phenix/yard/stubs/carrier/"],stack:["Spring profiles","OpenFeign"]},{id:"yard-events",archetype:"cube",code:"YE",name:"Event publisher",role:"the outbound event ramp",group:"yard",whatItDoes:"Turns completed gate work into integration events \u2014 GateArrivalCompleted and GateDepartureCompleted \u2014 published to the yard.events topic for anyone downstream.",howItsBuilt:"Publication is transactional-then-async: Spring Modulith records the event in the database with the domain change, an [[externalizer]] ships it to Azure Service Bus afterwards, and a logging broker takes over when no bus is configured \u2014 local dev needs no Azure.",files:["phenix.yard/src/main/java/com/uscs/phenix/yard/integration/event/YardEventExternalizer.java","phenix.yard/src/main/java/com/uscs/phenix/yard/integration/event/ServiceBusYardEventBroker.java","phenix.yard/src/main/java/com/uscs/phenix/yard/integration/event/GateArrivalEventPublisher.java"],stack:["Spring Modulith","Azure Service Bus"]},{id:"yard-legacy-migration",archetype:"cube",code:"YL",name:"Legacy bridge & migration",role:"the Oracle-to-Postgres mover",group:"yard",whatItDoes:"Moves warehouses from v1 to v2: reads yard topology, trailers, drivers and checks straight from the legacy Oracle schema, writes them to Postgres, and mints the sysid\u2194phenixId mappings that keep the two identity worlds in agreement.",howItsBuilt:"The [[ACL]] is the one sanctioned place sysids are translated \u2014 entity row and mapping row are written in a single transaction so the ids cannot drift. The orchestrator runs per warehouse with resumable state rows and per-table counts the admin screen reads back.",files:["phenix.yard/src/main/java/com/uscs/phenix/yard/migration/MigrationOrchestrator.java","phenix.yard/src/main/java/com/uscs/phenix/yard/legacy/OracleYardTopologyRepository.java","phenix.yard/src/main/java/com/uscs/phenix/yard/acl/"],stack:["Spring JDBC","Oracle driver"]},{id:"yard-db",archetype:"low-slab",code:"YD",name:"Yard Postgres",role:"the yard's own database",group:"yard",whatItDoes:"The service\u2019s PostgreSQL schema plus its runtime configuration. V1 is the schema exactly as it was lifted from Oracle; every change since is its own migration.",howItsBuilt:"[[Flyway]] owns the schema \u2014 applied migrations are never edited, pre-Flyway databases are baselined at V1. The Modulith event-publication table lives here too, which is what makes event publishing survive restarts.",files:["phenix.yard/src/main/resources/db/migration/V1__initial_schema.sql","phenix.yard/src/main/resources/application.yaml"],stack:["PostgreSQL","Flyway"]},{id:"yard-tests",archetype:"slab-stack",params:{levels:5},code:"YT",name:"BDD test rig",role:"the behavior harness",group:"yard",whatItDoes:"Cucumber scenarios that drive yard capabilities end to end \u2014 arrival through departure \u2014 over HTTP against a real Postgres in Testcontainers, alongside the unit and integration suites.",howItsBuilt:"Scenarios are deliberately [[schema-agnostic]]: they act through endpoints and fixtures, never the database, so the schema can keep evolving underneath. Recording stubs observe outbound
